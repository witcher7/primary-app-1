name: Devops-project
on: 
  push: 
    branches: ["main"]
  pull_request: 
    branches: ["main"]
jobs: 
   build-production:
      runs-on: ubuntu-latest
      steps:
        - name: Checkout the code 
          uses: actions/checkout@v4

        - name: Setup the Docker
          uses: docker/setup-buildx-action@v4

        - name: Build Docker image 
          run: docker build -t myapp:latest .
